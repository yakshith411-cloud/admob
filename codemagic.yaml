workflows:
  android-workflow:
    name: Android Release APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build Android Release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.experimental.self-contained-execution=false --no-daemon
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
